<div class="camera-window" [class.minimized]="isMinimized">
  <div class="camera-header">
    <span>Camera</span>
    <div class="camera-controls">
      <button
        class="minimize-btn"
        (click)="toggleMinimize()"
        title="Minimize"
      >
        {{ isMinimized ? '▢' : '−' }}
      </button>
      <button
        class="close-btn"
        (click)="stopCamera()"
        title="Close"
      >
        ✕
      </button>
    </div>
  </div>

  <div class="camera-content" *ngIf="!isMinimized">
    <div class="camera-container">
      <video
        #videoElement
        class="video-feed"
        [class.hidden]="!cameraActive"
        muted
        autoplay
        playsinline
      ></video>

      <!-- ✅ CANVAS OVERLAY (pose drawing + debug) -->
      <canvas
        #overlayCanvas
        class="overlay-canvas"
        [class.hidden]="!cameraActive"
      ></canvas>

      <!-- ✅ HUD (calibration + angles) -->
      <div class="tracking-hud" *ngIf="cameraActive">
        <ng-container *ngIf="calibrating; else anglesTpl">
          <div class="hud-title">
            CALIBRATION: {{ remainingCalibration | number:'1.1-1' }}s
          </div>
          <div class="hud-subtitle">Gardez votre bras le long du corps</div>
        </ng-container>

        <ng-template #anglesTpl>
          <div class="hud-angles">
            <span>X: {{ angles.x | number:'1.0-1' }}°</span>
            <span>Y: {{ angles.y | number:'1.0-1' }}°</span>
            <span>Z: {{ angles.z | number:'1.0-1' }}°</span>
          </div>
        </ng-template>
      </div>

      <div class="no-camera-placeholder" *ngIf="!cameraActive">
        <div class="placeholder-content">
          <p class="camera-icon">📷</p>
          <p *ngIf="cameraSupported && !errorMessage">Click "Start" to enable camera</p>
          <p *ngIf="!cameraSupported" class="error">{{ errorMessage }}</p>
          <p *ngIf="errorMessage && cameraSupported" class="error">{{ errorMessage }}</p>
        </div>
      </div>
    </div>

    <div class="camera-actions">
      <button
        class="start-btn"
        (click)="toggleCamera()"
        *ngIf="cameraSupported"
      >
        {{ cameraActive ? 'Stop' : 'Start' }}
      </button>

      <!-- ✅ Recalibration button -->
      <button
        class="recalibrate-btn"
        (click)="restartCalibration()"
        *ngIf="cameraActive"
        title="Recalibrate"
      >
        ⟲
      </button>

      <button
        class="fullscreen-btn"
        (click)="toggleFullscreen()"
        *ngIf="cameraActive"
        title="Fullscreen"
      >
        ⛶
      </button>
    </div>
  </div>
</div>
